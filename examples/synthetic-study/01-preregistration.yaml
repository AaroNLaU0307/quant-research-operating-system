schema_version: "1.0.0"

prereg_id: PREREG_SYNTHETIC_001
prereg_version: 1
project_id: PROJECT_SYNTHETIC_001
work_item: STUDY_SYNTHETIC_001
authored_by: ROLE_BINDING_MAIN_AGENT
authored_at: "2000-01-03T09:00:00Z"

lane: FULL

research_question: >
  On the synthetic development sample SAMPLE_SYNTHETIC_DEVELOPMENT, does a
  trailing ten-period mean of the generated return series carry information
  about the next period's generated return, at a magnitude large enough to be
  worth pursuing further?

hypothesis: >
  The trailing ten-period mean of returns has a non-zero linear association
  with the next period's return, and that association is at least as large as
  the decision-relevant threshold below.

mechanism: >
  The generating process is a fabricated moving-average process in which each
  return shares an innovation with its immediate predecessor. A trailing mean
  therefore carries some information about the next return. Whether the amount
  is large enough to act on is exactly what this study asks; the mechanism
  explains why an association could exist, and is not evidence that it is
  large.

metric:
  name: information_coefficient
  definition: >
    Pearson linear correlation between signal_t and the next period's return
    r_{t+1}, computed over every period of the development sample for which
    signal_t is defined. signal_t is the arithmetic mean of the ten returns
    r_{t-9} through r_t inclusive. The window ENDS at t: it never contains
    r_{t+1}, which is the quantity the signal is asked to predict.
  units: dimensionless
  scale: correlation_coefficient_minus_one_to_one
  transformation: none
  horizon: one period ahead

decision_threshold:
  applicable: true
  kind: SESOI
  value: 0.15
  metric_ref: information_coefficient
  scale_ref: correlation_coefficient_minus_one_to_one
  basis: >
    Fixed before any computation. Below a correlation of 0.15 on this synthetic
    sample the association is treated as too small to justify further work,
    regardless of statistical significance. The value is a stipulation of this
    fabricated study, not a claim about any real market.

sample:
  definition: >
    A deterministically generated synthetic return series produced by
    generate.py at seed 20260910. Period 0 through period 2999 form the
    development sample. No external, purchased, or market data is involved.
  identity: SAMPLE_SYNTHETIC_DEVELOPMENT
  period: "synthetic periods 0 through 2999"
  inclusion_rules:
    - Every generated period from 0 to 2999 inclusive.
    - Periods 0 to 8 contribute no paired observation because signal_t is
      undefined before ten returns exist.
  exclusion_rules:
    - Periods 3000 and later are excluded; they are the reserved sample.
  reserved_portion:
    exists: true
    identity: SAMPLE_SYNTHETIC_RESERVED
    definition: >
      Synthetic periods 3000 through 3999, generated by the same seed and
      written to a separate file. Excluded from fitting, selection, window
      choice and exploration for this study.
    enforcement: >
      Generated into a separate file that no script in this study opens.
      analyze.py, checks.py and verify.py each take the development file as
      their only data argument, and the reviewer's evidence surface enumerates
      the development file alone.

decision_rules:
  - order: 1
    condition: "information_coefficient < 0.15"
    outcome: not_promoted
    note: >
      Evaluated first. The association, if any, is too small to justify further
      work on this question.
  - order: 2
    condition: "information_coefficient >= 0.15"
    outcome: supported
    note: >
      Evaluated only if rule 1 did not fire. The candidate would proceed to
      evaluation on the reserved sample.

kill_conditions:
  - id: KILL_SYNTHETIC_1
    condition: "abs(information_coefficient) <= 0.02"
    consequence: >
      The line of investigation ends rather than merely failing to promote: an
      association indistinguishable from zero on 2990 paired observations
      would mean the premise itself is not worth revisiting on this sample.
    reachability:
      demonstrated: true
      method: >
        A Pearson correlation is bounded to [-1, 1] by construction, and on
        2990 paired observations of a process with no imposed association the
        sampling standard error is approximately 0.018. Values inside the kill
        region are therefore ordinary rather than unreachable, and the branch
        can fire on realistic input. Established before sealing, from the
        sample size alone.
      attainable_range: "[-1.0, 1.0], with sampling standard error near 0.018"
      evidence_ref: EVIDENCE_SYNTHETIC_REACHABILITY_1
      bounded_region: true

rule_domain_analysis:
  performed: true
  performed_at: "2000-01-03T09:00:00Z"
  evidence_ref: EVIDENCE_SYNTHETIC_DOMAIN_1
  rules_examined:
    - rule_ref: 1
      at_minimum: "fires at IC = -1.0"
      at_maximum: "does not fire at IC = +1.0"
      degenerate: false
    - rule_ref: 2
      at_minimum: "does not fire at IC = -1.0"
      at_maximum: "fires at IC = +1.0"
      degenerate: false
    - rule_ref: KILL_SYNTHETIC_1
