# --- candidates examined and NOT admitted --------------------------------
# Recorded so the admission test is demonstrably exercised rather than assumed.
not_admitted:
  - candidate: >
      The information coefficient is small enough that a different window
      length might do better.
    why_not: >
      Not a threat and not a defect. It is a proposal for a new question, and
      the sealed study's stop rule forecloses pursuing it under this
      preregistration (QROS-COMPLETION-STOP-RULE).
  - candidate: >
      The synthetic generating process is unrealistic.
    why_not: >
      True and deliberate. It is a property of the example, not a failure path
      on the current or next stage of this study.
  - candidate: >
      A stronger general guard against look-ahead could exist beyond the
      truncation-invariance check.
    why_not: >
      "A stronger safeguard is conceivable" is explicitly not admissible
      (QROS-COMPLETION-NO-SPECULATIVE-BLOCKER).
