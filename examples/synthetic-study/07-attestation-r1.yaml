# --- findings ------------------------------------------------------------
findings:
  - id: F1
    blocking: true
    threat_class: RESEARCH_CORRECTNESS
    evidence_class: REPRODUCED
    evidence: >
      Independent recomputation from the sealed definition gives 0.064635
      against the producer's 0.331216. On receiving the producer's
      implementation after the freeze, the cause is visible in one line: the
      signal window is written as r[t-k+2 : t+2], which ends at t+1 and
      therefore contains r_{t+1}. r_{t+1} is the quantity the signal is asked
      to predict. Removing that one period from the window reproduces the
      recomputed value exactly.
    failure_path: >
      The signal dated at period t contains the return of period t+1. The
      correlation therefore measures the signal against a target it already
      holds, and the reported 0.331216 is arithmetic on leaked data rather
      than a measurement of predictive information. On the current stage this
      value is the input to the sealed decision table: rule 2 would fire, the
      candidate would be recorded as supported, and the reserved sample would
      be spent on a candidate whose apparent edge is an artefact of the
      implementation.
    smallest_scope: >
      the window bounds of the signal construction in the analysis
      implementation; one line, and no other part of the pipeline
    minimal_fix: >
      compute the signal over r[t-k+1 : t+1] so the window ends at t, as the
      sealed definition states
    minimal_test: >
      a truncation-invariance check: recompute the signal on a prefix of the
      sample and confirm that no signal value at a period inside the prefix
      changes when later data is withheld

out_of_scope_observations:
  - >
    The four mechanical checks that were run cover shape, nullity, alignment
    and determinism only. Every one of them passes identically on the leaked
    and the correct implementation. This is not a finding against the result;
    it is a gap in the check set, and belongs in backlog.

